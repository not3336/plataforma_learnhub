{% extends "base.html" %}

{% block title %}Criar Conta - LearnHub{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 3rem auto; background: white; padding: 2rem; border-radius: 12px; box-shadow: var(--card-shadow);">
    <h2 style="text-align: center; margin-bottom: 1.5rem; color: var(--primary-color);">Crie sua conta</h2>
    
    {% if request.query_params.get('error') %}
        <div style="background: #fee2e2; color: var(--danger-color); padding: 10px; border-radius: 6px; margin-bottom: 1rem; text-align: center;">
            {{ request.query_params.get('error') }}
        </div>
    {% endif %}

    <form action="/register" method="POST">
        <div class="form-group">
            <label>Nome Completo</label>
            <input type="text" name="name" required placeholder="Ex: João Silva">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" required placeholder="seu@email.com">
        </div>
        <div class="form-group">
            <label>Senha</label>
            <input type="password" name="password" required placeholder="Crie uma senha forte">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">Criar Conta</button>
    </form>

    <p style="text-align: center; margin-top: 1.5rem; color: var(--gray-color);">
        Já tem conta? <a href="/login" style="color: var(--primary-color); font-weight: 600;">Faça Login</a>
    </p>
</div>
{% endblock %}
