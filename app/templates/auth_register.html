{% extends "base.html" %}

{% block title %}Criar Conta - LearnHub{% endblock %}

{% block content %}
<div class="auth-container">
    <h2 class="auth-title">Crie sua conta</h2>
    
    {% if request.query_params.get('error') %}
        <div class="alert alert-error">
            {{ request.query_params.get('error') }}
        </div>
    {% endif %}

    <form action="/register" method="POST">
        <div class="form-group">
            <label>Nome Completo</label>
            <input type="text" name="name" required placeholder="Ex: João Silva">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" required placeholder="seu@email.com">
        </div>
        <div class="form-group">
            <label>Senha</label>
            <input type="password" name="password" required placeholder="Crie uma senha forte">
        </div>
        <button type="submit" class="btn btn-primary w-100 justify-center">Criar Conta</button>
    </form>

    <p class="auth-footer">
        Já tem conta? <a href="/login" class="auth-link">Faça Login</a>
    </p>
</div>
{% endblock %}
